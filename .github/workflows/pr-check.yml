# .github/workflows/pr-check.yml
#
# Fast PR validation — runs on every pull request.
# Faster than the full CI pipeline: test + lint only, no Docker build.
# Gives developers feedback in about five minutes, without the Docker build.

name: PR Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Cancel in-progress runs when new commits are pushed to the PR
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # CPU-only PyTorch: the book never uses a GPU, and the default Linux
          # wheels pull several GB of CUDA libraries (enough to fill the runner disk).
          pip install -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-asyncio

      - name: Install spaCy model (Chapter 13 skill extractor)
        run: python -m spacy download en_core_web_sm

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -q
        env:
          ENVIRONMENT: test
          PYTHONPATH: ${{ github.workspace }}

  pr-lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff==0.8.6  # same version as requirements-dev-lock.txt

      - name: Lint with ruff
        run: |
          ruff check book/ tests/ \
            --output-format=github \
            --select=E,F,W,I \
            --ignore=E501

  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-test, pr-lint]
    if: always()

    steps:
      - name: Write PR summary
        run: |
          echo "## PR Check Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ needs.pr-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint  | ${{ needs.pr-lint.result == 'success' && '✅ Passed' || '⚠️ Issues' }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.pr-test.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Tests must pass before merging." >> $GITHUB_STEP_SUMMARY
          fi
