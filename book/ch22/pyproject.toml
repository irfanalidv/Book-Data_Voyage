[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talentlens-core"
version = "0.1.0"
description = "TalentLens book package — CV parsing, role classification, vector search, FastAPI wiring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Irfan Ali", email = "irfan@datacortex.in" }]
keywords = ["talentlens", "jobs", "ml", "fastapi", "embeddings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Ranges, not pins: lower bound = tested, upper bound = next major version.
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "scikit-learn>=1.3,<2.0",
  "joblib>=1.3,<2.0",
  "pydantic>=2.0,<3.0",
  "fastapi>=0.100,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
llm = ["groq>=0.13,<1.0", "openai>=1.55,<2.0"]
vectors = ["sentence-transformers>=3.0,<4.0"]

[project.urls]
Homepage = "https://github.com/irfanalidv/Book-Data_Voyage"

[tool.setuptools.packages.find]
where = ["."]
include = ["talentlens_core*"]
