# Publish talentlens-core to PyPI when a version tag is pushed (e.g. talentlens-core-v0.1.0).
# Configure "trusted publisher" on PyPI for this workflow, or set PYPI_API_TOKEN secret.

name: Publish talentlens-core

on:
  push:
    tags:
      - "talentlens-core-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: book/ch22
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: book/ch22/dist
          password: ${{ secrets.PYPI_API_TOKEN }}
        # Omit password when using PyPI trusted publishing for this workflow.
