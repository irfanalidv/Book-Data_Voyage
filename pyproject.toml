[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-voyage"
version = "0.1.0"
description = "Data Voyage — TalentLens job market intelligence (book + development package)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Irfan Ali", email = "irfan@datacortex.in" }]
dependencies = [
    "pandas~=2.3.0",
    "numpy~=2.1.0",
    "matplotlib~=3.9.0",
    "scikit-learn~=1.5.0",
    "pydantic==2.13.3",
    "pydantic-settings~=2.6.0",
    "fastapi==0.136.1",
    "requests~=2.33.0",
    "python-dotenv~=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "black>=24.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.32.0",
    "pre-commit>=4.0",
]
ml = [
    "torch~=2.8.0",
    "transformers~=4.57.0",
    "sentence-transformers~=5.6.0",
    "imbalanced-learn~=0.13.0",
]
llm = [
    "openai~=1.55.0",
    "groq~=0.13.0",
    "anthropic~=0.42.0",
]
vectors = [
    "faiss-cpu~=1.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["talentlens*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["book/"]

[[tool.mypy.overrides]]
module = "book.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
